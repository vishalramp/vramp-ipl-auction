<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VRAMP Auction Arena</title>
<style>
:root{--bg:#10071b;--card:#1b1029;--card2:#241538;--line:#3a2454;--pink:#ff3fb4;--gold:#ffc857;--mint:#53e0b2;--red:#ff5f70;--text:#fff8ff;--muted:#bcaac7}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#54206d,transparent 40%),var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:8px 0 16px}.logo{font-weight:900;letter-spacing:1px;font-size:22px}.vr{font-size:10px;opacity:.45;position:fixed;right:9px;bottom:7px}.pill{padding:6px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:260px 1fr 280px;gap:14px;margin-top:14px}.card{background:linear-gradient(145deg,#1d102b,#130b20);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 14px 40px #0004}.hero{text-align:center;padding:28px 18px}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:var(--muted)}input,select,button{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:#100918;color:var(--text);margin-top:8px}button{cursor:pointer;background:linear-gradient(90deg,#ff3fb4,#7e4dff);border:0;font-weight:800}button.alt{background:#241538;border:1px solid var(--line)}button.danger{background:#5b1828}button:disabled{opacity:.4}.teams{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.team{padding:10px 4px;text-align:center;border:1px solid var(--line);border-radius:10px;cursor:pointer}.team.on{border-color:var(--pink);background:#ff3fb414}.player{text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center}.set{color:var(--gold);font-weight:800}.name{font-size:34px;font-weight:900;margin:10px 0}.base{color:var(--muted)}.bid{font-size:44px;color:var(--mint);font-weight:900}.timer{font-size:54px;font-weight:900;color:var(--pink)}.bidbtn{font-size:18px;padding:15px}.row{display:flex;gap:8px}.row>*{flex:1}.feed{max-height:430px;overflow:auto}.feed div{padding:8px 0;border-bottom:1px solid #ffffff0b;font-size:13px}.small{font-size:12px;color:var(--muted)}.hide{display:none}.admin{border-color:#71406d}.online{color:var(--mint)}.offline{color:var(--red)}.room{font-size:26px;font-weight:900;letter-spacing:4px;color:var(--gold)}.table div{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #ffffff0b}.mode{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode button.active{outline:2px solid var(--pink)}@media(max-width:900px){.grid{grid-template-columns:1fr}.teams{grid-template-columns:repeat(5,1fr)}.name{font-size:27px}.hero h1{font-size:34px}}
</style></head><body>
<div class="wrap">
<div class="top"><div class="logo">VRAMP <span style="color:#ff3fb4">AUCTION ARENA</span></div><div id="status" class="pill">Not connected</div></div>

<section id="home">
<div class="card hero"><h1>IPL AUCTION</h1><p>Build your franchise. Bid live. Win the auction.</p>
<input id="name" placeholder="Your name">
<div class="teams" id="teams"></div>
<div class="mode"><button id="mega" class="active">MEGA AUCTION</button><button id="mock" class="alt">MOCK AUCTION</button></div>
<div class="row"><button id="create">CREATE ROOM</button><button id="joinBtn" class="alt">JOIN ROOM</button></div>
<input id="code" placeholder="Room code" style="text-transform:uppercase">
<label class="small"><input id="spectate" type="checkbox" style="width:auto"> Join as spectator</label>
</div></section>

<section id="lobby" class="hide">
<div class="grid">
<div class="card"><div class="small">ROOM CODE</div><div id="roomCode" class="room">------</div><button id="copy">COPY CODE</button><div class="small" style="margin-top:10px">Share this code with friends.</div></div>
<div class="card"><h3>Players</h3><div id="players"></div><button id="start">START AUCTION</button></div>
<div class="card admin"><h3>Host Settings</h3><label class="small">Timer</label><select id="timer"><option>5</option><option selected>10</option><option>15</option><option>20</option><option>30</option></select><label class="small">Reset after bid</label><select id="reset"><option>5</option><option>10</option><option>15</option></select><button id="saveSettings">SAVE SETTINGS</button></div>
</div>
</section>

<section id="game" class="hide">
<div class="grid">
<aside class="card"><h3>Teams</h3><div id="teamTable" class="table"></div><h3>Activity</h3><div id="feed" class="feed"></div></aside>
<main class="card player"><div id="set" class="set">SET 1</div><div id="pname" class="name">Waiting…</div><div id="meta" class="small"></div><div>BASE PRICE <b id="base"></b></div><div id="bid" class="bid">₹0.00 Cr</div><div id="bidder" class="small"></div><div id="timerView" class="timer">10</div><button id="bidBtn" class="bidbtn">BID</button><div class="row"><button id="unsold" class="alt">UNSOLD</button><button id="next" class="alt">NEXT</button></div></main>
<aside class="card"><h3>Host / Players</h3><div id="hostPanel"></div><h3>My Squad</h3><div id="mySquad"></div></aside>
</div></section>
<div class="vr">VRAMP</div>
</div>
<script>
let ws,me,host=false,code="",mode="mega",selectedTeam="MI",state=null,pool=[];
const $=id=>document.getElementById(id);
const TEAMS=["MI","CSK","RCB","KKR","DC","PBKS","RR","SRH","GT","LSG"];
TEAMS.forEach(t=>{const d=document.createElement("div");d.className="team"+(t==="MI"?" on":"");d.textContent=t;d.onclick=()=>{selectedTeam=t;document.querySelectorAll(".team").forEach(x=>x.classList.remove("on"));d.classList.add("on")};$("teams").appendChild(d)});
$("mega").onclick=()=>{mode="mega";$("mega").classList.add("active");$("mock").classList.remove("active")};
$("mock").onclick=()=>{mode="mock";$("mock").classList.add("active");$("mega").classList.remove("active")};

async function loadPool(){
 try{
  const r=await fetch("https://r.jina.ai/https://www.cricwindow.com/ipl-2025/auction-registered-players-list.html");
  const txt=await r.text(); const lines=txt.split(/\n+/).map(x=>x.trim()).filter(Boolean);
  const out=[]; const seen=new Set();
  for(const line of lines){
   const m=line.match(/^\d+\s+(.+?)\s+(India|Australia|England|South Africa|New Zealand|West Indies|Sri Lanka|Afghanistan|Bangladesh|Ireland|Zimbabwe|USA|Scotland|Nepal|Netherlands|UAE)\s+(Batter|Bowler|All-Rounder|Wicket-Keeper|Wicketkeeper).*?₹\s*([0-9.]+)\s*(Cr|L)/i);
   if(m){const n=m[1].trim();if(!seen.has(n)){seen.add(n);out.push({name:n,country:m[2],role:m[3],baseLakh:Math.round(parseFloat(m[4])*(m[5].toLowerCase()==="cr"?100:1))})}}
  }
  if(out.length>100) pool=out;
 }catch(e){}
 if(!pool.length) pool=[
  {name:"Sample Player",country:"India",role:"Batter",baseLakh:50},
  {name:"Sample Overseas",country:"Australia",role:"Bowler",baseLakh:100}
 ];
}
function connect(){
 ws=new WebSocket((location.protocol==="https:"?"wss://":"ws://")+location.host);
 ws.onopen=()=>{$("status").textContent="Connected";$("status").style.color="#53e0b2"};
 ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.type==="error")return alert(m.msg); if(m.type==="kicked"){alert("You were removed by the host.");location.reload()} if(m.type==="joined"){me=m.id;code=m.code;host=m.host;show("lobby");$("roomCode").textContent=code} if(m.type==="state"){state=m;render()} if(m.type==="finished")alert("Auction finished!")};
 ws.onclose=()=>{$("status").textContent="Offline";$("status").style.color="#ff5f70"};
}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify(o))}
function show(x){["home","lobby","game"].forEach(a=>$(a).classList.toggle("hide",a!==x))}
$("create").onclick=async()=>{await loadPool();connect();setTimeout(()=>send({type:"create",name:$("name").value||"Host",team:selectedTeam,mode,settings:{timer:+$("timer").value||10,reset:5}}),300)};
$("joinBtn").onclick=()=>{connect();setTimeout(()=>send({type:"join",name:$("name").value||"Player",team:selectedTeam,code:$("code").value.trim(),spectator:$("spectate").checked}),300)};
$("start").onclick=()=>send({type:"start",players:pool});
$("copy").onclick=()=>navigator.clipboard?.writeText(code);
$("saveSettings").onclick=()=>send({type:"settings",timer:+$("timer").value,reset:+$("reset").value,accelerated:true});
$("bidBtn").onclick=()=>send({type:"bid"});
$("unsold").onclick=()=>send({type:"unsold"});
$("next").onclick=()=>send({type:"next"});

function render(){
 if(!state)return;
 if(state.started)show("game"); else show("lobby");
 $("players").innerHTML=state.room.players.map(p=>`<div style="padding:7px;border-bottom:1px solid #ffffff0b"><b>${p.team}</b> ${p.name} <span class="${p.online?'online':'offline'}">${p.online?'●':'○'}</span>${host&&p.online?` <button style="width:auto;padding:4px 7px;margin:0;float:right" onclick="kick('${p.id||""}')">Kick</button>`:""}</div>`).join("");
 $("start").style.display=host&&!state.started?"block":"none";
 $("saveSettings").style.display=host?"block":"none";
 if(state.auction){
  const a=state.auction,p=a.player;
  $("set").textContent=`AUCTION • ${p.role}`;
  $("pname").textContent=p.name;
  $("meta").textContent=`${p.country} • ${p.role}`;
  $("base").textContent=`₹${(p.baseLakh/100).toFixed(2)} Cr`;
  $("bid").textContent=`₹${(a.bid/100).toFixed(2)} Cr`;
  $("bidder").textContent=a.bidder?`Highest bidder: ${a.bidder.team} • ${a.bidder.name}`:"No bids yet";
  $("bidBtn").disabled=!state.started;
  $("unsold").style.display=host?"block":"none"; $("next").style.display=host?"block":"none";
  const secs=Math.max(0,Math.ceil((a.endsAt-Date.now())/1000)); $("timerView").textContent=secs;
  setTimeout(()=>state&&render(),250);
 }
 $("teamTable").innerHTML=Object.entries(state.teams).map(([t,v])=>`<div><b>${t}</b><span>₹${(v.purse/100).toFixed(2)} Cr • ${v.squad.length}/25 • OS ${v.overseas}/8</span></div>`).join("");
 $("feed").innerHTML=(state.feed||[]).slice().reverse().map(x=>`<div>${x.text}</div>`).join("");
 const mine=state.teams[selectedTeam]?.squad||[];$("mySquad").innerHTML=mine.length?mine.map(p=>`<div class="small" style="padding:4px">${p.name} • ₹${(p.baseLakh/100).toFixed(2)} Cr</div>`).join(""):"<span class='small'>No players yet</span>";
 $("hostPanel").innerHTML=host?`<span class="pill">HOST</span><p class="small">You control timer, start, unsold and player removal.</p>`:"<span class='small'>Host controls are hidden.</span>";
}
function kick(id){ if(id)send({type:"kick",id})}
</script></body></html>
